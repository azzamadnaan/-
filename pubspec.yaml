name: quran_app
description: "تطبيق القرآن الكريم مع استماع وتنزيل أوفلاين وإعلانات"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # تشغيل الصوتيات
  just_audio: ^0.9.36
  # التحميل وحفظ الملفات
  dio: ^5.4.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  # إعلانات جوجل AdMob
  google_mobile_ads: ^5.0.0
  # أجهزة العرض والتنسيق
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
