name: Build Universal APK for All Phones

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # البناء بأمر يدمج كل المعماريات ليعمل على أي تلفون أندرويد
      - name: Build Universal Release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      # رفع ملف الـ APK النهائي لاستخراجه وتحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-App-Universal-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          
